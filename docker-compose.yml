services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kangla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kangla}
      POSTGRES_DB: kangla
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kangla -d kangla"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://kangla:${POSTGRES_PASSWORD:-kangla}@db:5432/kangla
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars) for production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AUTO_CREATE_TABLES: "false"
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             gunicorn -c gunicorn.conf.py app.main:app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata: