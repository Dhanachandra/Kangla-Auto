name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" "pytest" "httpx" 2>/dev/null || pip install -e . pytest httpx

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./data/test.db
          SECRET_KEY: ci-secret-key-that-is-long-enough-1234567890
          SEED_ON_STARTUP: "false"
        run: pytest -q