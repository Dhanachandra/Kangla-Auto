services:
  - type: web
    name: kangla-auto
    runtime: docker
    repo: https://github.com/Dhanachandra/Kangla-Auto
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false