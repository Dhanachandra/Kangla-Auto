<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Kangla Auto</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">K</span>
      <span>Kangla Auto</span>
    </a>
    <div class="user-chip">
      <span class="avatar" id="user-avatar"></span>
      <span><span id="user-name"></span> <span id="user-role"></span></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
    </div>
  </nav>

  <main class="wrap">
    <div class="tabs" id="view-tabs">
      <button class="tab-btn" data-view="rider" type="button">Rider</button>
      <button class="tab-btn" data-view="driver" type="button">Driver</button>
    </div>
    <div class="role-strip" id="role-strip"></div>

    <section id="rider-panel" hidden>
      <div class="grid grid-2">
        <div class="card stack">
          <h2>Book a ride</h2>
          <form id="book-form" class="stack">
            <div class="field">
              <label for="pickup">Pickup</label>
              <input id="pickup" name="pickup" type="text" placeholder="e.g. Kangla Fort gate" required />
            </div>
            <div class="field">
              <label for="dropoff">Dropoff</label>
              <input id="dropoff" name="dropoff" type="text" placeholder="e.g. Khwairamband Bazar" required />
            </div>
            <div class="field">
              <label for="distance_km">Distance (km) — optional</label>
              <input id="distance_km" name="distance_km" type="number" step="0.1" min="0.1" placeholder="e.g. 2.5" />
            </div>
            <button class="btn btn-primary" type="submit">Request ride</button>
          </form>
        </div>
        <div class="card">
          <h2>My bookings</h2>
          <div id="rider-bookings"></div>
        </div>
      </div>
    </section>

    <section id="driver-panel" hidden>
      <div class="grid grid-2">
        <div class="card">
          <h2 id="pending-title">Open bookings</h2>
          <div id="pending-bookings"></div>
        </div>
        <div class="card">
          <h2 id="my-title">My rides</h2>
          <div id="my-bookings"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
